[package]
name = "posle-engine"
version = "0.9.0"
edition = "2021"
description = "Local-first meeting library, grounded notes and spaced repetition for Posle"
license = "MIT"

[lib]
name = "posle_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "posle-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
fsrs = { version = "=6.6.2", default-features = false }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust-stemmers = "1.2.0"
unicode-normalization = "0.1.26"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
