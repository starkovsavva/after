[package]
name = "posle-engine"
version = "0.17.6"
edition = "2021"
description = "Local-first meeting library, grounded notes and spaced repetition for After"
license = "MIT"

[lib]
name = "posle_core"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "posle-engine"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
fsrs = { version = "=6.6.2", default-features = false }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust-stemmers = "1.2.0"
unicode-normalization = "0.1.26"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
ignore = "=0.4.25"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
