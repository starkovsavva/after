name: Build and checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test dependencies
        run: python3 -m pip install numpy==2.2.6 imageio-ffmpeg==0.6.0
      - name: Swift build and isolated unit checks
        run: python3 scripts/verify.py quick
