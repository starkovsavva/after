[package]
name = "after-process-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Scoped process-tree ownership for After's native hosts"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
