[package]
name = "after-desktop"
version = "0.1.2"
description = "Cross-platform After desktop shell"
edition = "2021"
license = "MIT"

[lib]
name = "after_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "after-desktop"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
sha2 = "0.10"

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rfd = "=0.15.4"

[target.'cfg(windows)'.dependencies]
wasapi = "=0.26.0"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Performance", "Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "=2.12.5", features = ["test"] }
